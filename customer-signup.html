<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Signup - Gharatil Seva</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white flex items-center justify-center min-h-screen p-4 sm:p-6 font-sans">

    <!-- Signup Card Container -->
    <div class="bg-gray-900/80 backdrop-blur-xl p-8 sm:p-10 rounded-3xl shadow-2xl border border-gray-800 max-w-md w-full my-6">
        
        <!-- Header -->
        <div class="text-center mb-6">
            <h2 class="text-2xl sm:text-3xl font-extrabold text-emerald-400 tracking-tight">Customer Registration</h2>
            <p class="text-xs text-gray-400 mt-1">Pune madhil gharatil kamasathi instant account banva</p>
        </div>
        
        <form id="customer-signup-form" class="flex flex-col gap-4 sm:gap-5">
            <!-- Full Name -->
            <div>
                <label class="block text-xs text-gray-300 mb-1.5 font-semibold tracking-wide">
                    Purna Nav (Full Name) <span class="text-emerald-400">*</span>
                </label>
                <input type="text" id="cust-name" required placeholder="e.g. Rahul Sharma" class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-xl focus:outline-none focus:border-emerald-500 text-sm text-white transition-all">
            </div>

            <!-- Mobile Number -->
            <div>
                <label class="block text-xs text-gray-300 mb-1.5 font-semibold tracking-wide">
                    Mobile Number (Login ID) <span class="text-emerald-400">*</span>
                </label>
                <input type="tel" id="cust-phone" pattern="[0-9]{10}" required placeholder="10-digit Mobile Number" class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-xl focus:outline-none focus:border-emerald-500 text-sm text-white transition-all">
            </div>

            <!-- Area / Locality Selection -->
            <div>
                <label class="block text-xs text-gray-300 mb-1.5 font-semibold tracking-wide">
                    Tumcha Pune Area (Select Area) <span class="text-emerald-400">*</span>
                </label>
                <select id="cust-area" required class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-xl focus:outline-none focus:border-emerald-500 text-sm text-white transition-all cursor-pointer">
                    <option value="" disabled selected>Pune madhil area nivda</option>
                    <option value="Swargate">Swargate</option>
                    <option value="Katraj">Katraj</option>
                    <option value="Shivajinagar">Shivajinagar</option>
                    <option value="Kothrud">Kothrud</option>
                    <option value="Hadapsar">Hadapsar</option>
                    <option value="Hinjewadi">Hinjewadi</option>
                    <option value="Viman Nagar">Viman Nagar</option>
                    <option value="Baner">Baner</option>
                    <option value="Wakad">Wakad</option>
                </select>
            </div>
            
            <!-- Password -->
            <div>
                <label class="block text-xs text-gray-300 mb-1.5 font-semibold tracking-wide">
                    Password Banva <span class="text-emerald-400">*</span>
                </label>
                <input type="password" id="cust-password" minlength="6" required placeholder="••••••••" class="w-full px-4 py-3 bg-gray-800 border border-gray-700 rounded-xl focus:outline-none focus:border-emerald-500 text-sm text-white transition-all">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg text-sm mt-2 active:scale-[0.99] flex items-center justify-center gap-2">
                <span>Account Banva & Proceed</span>
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path>
                </svg>
            </button>
        </form>

        <!-- Existing Account Link -->
        <p class="text-center text-xs text-gray-400 mt-6 border-t border-gray-800/80 pt-4">
            Adich account ahe? <a href="customer-login.html" class="text-emerald-400 font-semibold hover:underline">Login Kara</a>
        </p>
    </div>

    <script>
        document.getElementById('customer-signup-form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const name = document.getElementById('cust-name').value;
            const phone = document.getElementById('cust-phone').value;
            const area = document.getElementById('cust-area').value;
            
            // Store registration data in localStorage
            const userData = {
                name: name,
                phone: phone,
                area: area,
                role: 'customer'
            };
            
            localStorage.setItem('gharatil_seva_user', JSON.stringify(userData));
            
            alert(`Swagat ahe, ${name}! Tumche account successfully tayar zale ahe.`);
            
            // Redirect to login or booking page
            window.location.href = "customer-login.html";
        });
    </script>
</body>
</html>
