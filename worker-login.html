<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Login - Gharatil Seva</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white flex items-center justify-center min-h-screen p-6 sm:p-8">

    <!-- Card Container: Matched with Worker Signup page styling -->
    <div class="bg-gray-900/80 backdrop-blur-xl p-10 md:p-12 rounded-3xl shadow-2xl border border-gray-800 max-w-lg w-full">
        
        <!-- Header Section -->
        <h2 class="text-3xl font-extrabold mb-3 text-center text-purple-400 tracking-tight">Worker Login</h2>
        <p class="text-sm text-gray-400 text-center mb-8">Aaplya account madhe login karun duty suru kara</p>
        
        <!-- Form Fields with enhanced spacing -->
        <form id="worker-login-form" class="flex flex-col gap-5">
            <div>
                <label class="block text-xs text-gray-300 mb-2 font-semibold tracking-wide">Worker Mobile Number</label>
                <input type="tel" id="worker-phone" required placeholder="9876543210" class="w-full px-4 py-3.5 bg-gray-800 border border-gray-700 rounded-xl focus:outline-none focus:border-purple-500 text-sm text-white transition-all">
            </div>
            
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label class="text-xs text-gray-300 font-semibold tracking-wide">Password</label>
                    <a href="#" class="text-xs text-purple-400 hover:underline">Password visorla?</a>
                </div>
                <input type="password" id="worker-password" required placeholder="••••••••" class="w-full px-4 py-3.5 bg-gray-800 border border-gray-700 rounded-xl focus:outline-none focus:border-purple-500 text-sm text-white transition-all">
            </div>

            <!-- Submit Button -->
            <button type="submit" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-4 rounded-xl transition shadow-lg text-sm mt-4 hover:shadow-purple-500/20 active:scale-[0.99]">
                Worker Login Kara
            </button>
        </form>

        <!-- Signup Navigation Link -->
        <p class="text-center text-xs text-gray-400 mt-8">
            Naveen worker ahat? <a href="worker-signup.html" class="text-purple-400 font-semibold hover:underline ml-1">Noondani (Signup) Kara</a>
        </p>
    </div>

    <script>
        document.getElementById('worker-login-form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert("Worker login success! Duty Dashboard var jat ahot...");
            window.location.href = "worker-dashboard.html";
        });
    </script>
</body>
</html>
