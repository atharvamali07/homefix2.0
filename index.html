<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Navigation - Gharatil Seva</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS for Free Maps -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col font-sans">

    <!-- Top Navigation Bar -->
    <div class="bg-gray-900/90 backdrop-blur-md px-6 py-4 border-b border-gray-800 flex justify-between items-center shadow-lg z-10">
        <div>
            <h2 class="text-base sm:text-lg font-extrabold text-emerald-400 tracking-wide">Live Navigation</h2>
            <p class="text-[11px] text-gray-400">Order ID: #ORD-8942</p>
        </div>
        <a href="worker-dashboard.html" class="text-xs font-semibold text-gray-300 bg-gray-800 hover:bg-gray-700 border border-gray-700 px-4 py-2 rounded-xl transition">
            ← Dashboard
        </a>
    </div>

    <!-- Map Container -->
    <div id="map" class="flex-grow w-full h-[55vh] z-0"></div>

    <!-- Bottom Status & Actions Card -->
    <div class="bg-gray-900/95 backdrop-blur-xl p-6 border-t border-gray-800 shadow-2xl flex flex-col gap-5 rounded-t-3xl -mt-4 z-10">
        
        <!-- Status Indicator -->
        <div class="flex justify-between items-center border-b border-gray-800 pb-4">
            <div class="flex items-center gap-2">
                <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-ping"></span>
                <p class="text-xs sm:text-sm font-semibold text-emerald-400">Live Location Tracking Active</p>
            </div>
            <span class="bg-purple-600/20 text-purple-300 border border-purple-500/30 text-xs px-3 py-1 rounded-full font-semibold">Plumbing Work</span>
        </div>

        <!-- Address & Customer Info -->
        <div class="flex flex-col gap-2">
            <p class="text-xs text-purple-400 font-semibold tracking-wide">Customer Address:</p>
            <p class="text-sm text-gray-200 font-medium leading-relaxed" id="address-display">
                Flat 402, Shivtej Heights, Near Swargate, Pune
            </p>
        </div>

        <!-- Action Buttons Grid -->
        <div class="grid grid-cols-2 gap-3 pt-1">
            <a href="tel:9876543210" class="flex items-center justify-center gap-2 bg-gray-800 hover:bg-gray-700 text-white py-3.5 px-4 rounded-xl font-bold text-xs transition border border-gray-700">
                <svg class="w-4 h-4 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"></path>
                </svg>
                Call Customer
            </a>

            <button onclick="openGoogleMaps()" class="flex items-center justify-center gap-2 bg-gray-800 hover:bg-gray-700 text-white py-3.5 px-4 rounded-xl font-bold text-xs transition border border-gray-700">
                <svg class="w-4 h-4 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7"></path>
                </svg>
                Open Google Maps
            </button>
        </div>

        <!-- Complete Task Button -->
        <button onclick="completeJob()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white py-4 rounded-xl font-bold text-sm transition shadow-lg shadow-emerald-900/30 active:scale-[0.99]">
            Mark Kam Purna Zale (Complete Service)
        </button>
    </div>

    <!-- Leaflet JS Library -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let currentLat = 18.5204;
        let currentLon = 73.8567;

        // Map initialize (Default: Swargate, Pune)
        const map = L.map('map').setView([currentLat, currentLon], 14);

        // Standard OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        // Get current geolocation
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition((position) => {
                currentLat = position.coords.latitude;
                currentLon = position.coords.longitude;

                map.setView([currentLat, currentLon], 15);

                // Add Worker Location Marker
                L.marker([currentLat, currentLon]).addTo(map)
                    .bindPopup('<b>Tumchi Location (Worker)</b>')
                    .openPopup();

            }, (error) => {
                alert("Location permission deny keli ahe! Map vapranyasathi permission dyavi lagel.");
            });
        }

        function openGoogleMaps() {
            // Opens Google Maps navigation with worker's current coordinates
            const googleMapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${currentLat},${currentLon}`;
            window.open(googleMapsUrl, '_blank');
        }

        function completeJob() {
            if (confirm("Kharach kam purna zale ahe ka?")) {
                alert("Kam Purna Zale! Customer la notification pathavli ahe.");
                window.location.href = "worker-dashboard.html";
            }
        }
    </script>
</body>
</html>
