<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gharatil Seva - Choose Your Role</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white min-h-screen flex items-center justify-center p-4 font-sans">

    <div class="max-w-md w-full bg-gray-900/80 backdrop-blur-xl p-6 sm:p-8 rounded-3xl shadow-2xl border border-gray-800 text-center">
        
        <!-- Header -->
        <div class="mb-8">
            <h1 class="text-3xl font-extrabold text-emerald-400 tracking-tight mb-2">Gharatil Seva</h1>
            <p class="text-xs text-gray-400">Gharatil kamansathi local workers ani instant booking (Pune)</p>
        </div>

        <p class="text-sm font-semibold text-gray-300 mb-6">Tumhi kon mhanun login karu इच्छिता?</p>

        <!-- Role Options -->
        <div class="flex flex-col gap-4">
            
            <!-- Customer Role Button -->
            <a href="customer-dashboard.html" class="group relative bg-gray-800 hover:bg-emerald-600/20 border border-gray-700 hover:border-emerald-500 p-5 rounded-2xl transition duration-300 flex items-center gap-4 text-left shadow-lg active:scale-[0.98]">
                <div class="w-12 h-12 bg-emerald-500/10 text-emerald-400 rounded-xl flex items-center justify-center group-hover:bg-emerald-500 group-hover:text-white transition duration-300">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                    </svg>
                </div>
                <div>
                    <h2 class="text-base font-bold text-white group-hover:text-emerald-400 transition">Customer (Grahak)</h2>
                    <p class="text-xs text-gray-400">Mhala kaam karun pahije (Plumber, Electrician, etc.)</p>
                </div>
            </a>

            <!-- Worker Role Button -->
            <a href="worker-dashboard.html" class="group relative bg-gray-800 hover:bg-emerald-600/20 border border-gray-700 hover:border-emerald-500 p-5 rounded-2xl transition duration-300 flex items-center gap-4 text-left shadow-lg active:scale-[0.98]">
                <div class="w-12 h-12 bg-emerald-500/10 text-emerald-400 rounded-xl flex items-center justify-center group-hover:bg-emerald-500 group-hover:text-white transition duration-300">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                    </svg>
                </div>
                <div>
                    <h2 class="text-base font-bold text-white group-hover:text-emerald-400 transition">Worker (Sevak)</h2>
                    <p class="text-xs text-gray-400">Mhala kam pahije (Accept bookings & earn)</p>
                </div>
            </a>

        </div>

        <div class="mt-8 border-t border-gray-800 pt-4">
            <p class="text-[11px] text-gray-500">Pune local service platform • 2026</p>
        </div>

    </div>

</body>
</html>
