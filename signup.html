<!DOCTYPE html>
<html lang="mr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker Signup - Gharatil Seva</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 text-white flex items-center justify-center min-h-screen p-6 sm:p-8">

    <!-- Card Container: Added larger padding (p-10 md:p-12) and max-width adjustment -->
    <div class="bg-gray-900/80 backdrop-blur-xl p-10 md:p-12 rounded-3xl shadow-2xl border border-gray-800 max-w-lg w-full">
        
        <!-- Header Section: Added margin-bottom spacing -->
        <h2 class="text-3xl font-extrabold mb-3 text-center text-purple-400 tracking-tight">Worker Registration</h2>
        <p class="text-sm text-gray-400 text-center mb-8">Pune madhe sevapurvnyasathi worker noondani kara</p>
        
        <!-- Form: Gap increased to gap-5 -->
        <form id="worker-signup-form" class="flex flex-col gap-5">
            <div>
                <label class="block text-xs text-gray-300 mb-2 font-semibold tracking-wide">Worker Nav (Full Name)</label>
                <input type="text" id="work-name" required placeholder="Amit Patil" class="w-full px-4 py-3.5 bg-gray-800 border border-gray-700 rounded-xl focus:outline-none focus:border-purple-500 text-sm transition-all">
            </div>

            <div>
                <label class="block text-xs text-gray-300 mb-2 font-semibold tracking-wide">Mobile Number (Login ID)</label>
                <input type="tel" id="work-phone" required placeholder="9876543210" class="w-full px-4 py-3.5 bg-gray-800 border border-gray-700 rounded-xl focus:outline-none focus:border-purple-500 text-sm transition-all">
            </div>

            <div>
                <label class="block text-xs text-gray-300 mb-2 font-semibold tracking-wide">Kamacha Prakar (Service Speciality)</label>
                <select id="work-service" required class="w-full px-4 py-3.5 bg-gray-800 border border-gray-700 rounded-xl focus:outline-none focus:border-purple-500 text-sm text-white transition-all">
                    <option value="Plumbing">Plumbing</option>
                    <option value="Electrician">Electrician</option>
                    <option value="Painter">Painter</option>
                    <option value="Housekeeping">Housekeeping</option>
                </select>
            </div>
            
            <div>
                <label class="block text-xs text-gray-300 mb-2 font-semibold tracking-wide">Password Banva</label>
                <input type="password" id="work-password" required placeholder="••••••••" class="w-full px-4 py-3.5 bg-gray-800 border border-gray-700 rounded-xl focus:outline-none focus:border-purple-500 text-sm transition-all">
            </div>

            <!-- Submit Button: Added top margin (mt-4) for breathing room -->
            <button type="submit" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-4 rounded-xl transition shadow-lg text-sm mt-4 hover:shadow-purple-500/20 active:scale-[0.99]">
                Worker Registration Purna Kara
            </button>
        </form>

        <!-- Footer Link: Increased margin-top -->
        <p class="text-center text-xs text-gray-400 mt-8">
            Adich account ahe? <a href="worker-login.html" class="text-purple-400 font-semibold hover:underline ml-1">Login Kara</a>
        </p>
    </div>

    <script>
        document.getElementById('worker-signup-form').addEventListener('submit', function(e) {
            e.preventDefault();
            alert("Worker Registration Successful! Atata tumhi login karu shakta.");
            window.location.href = "worker-login.html";
        });
    </script>
</body>
</html>
